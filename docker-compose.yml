version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marcas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marcas"]
      interval: 10s
      timeout: 5s
      retries: 5

  marcasapi:
    image: ${DOCKER_REGISTRY-}marcasapi
    build:
      context: src/MarcasApi
      dockerfile: Dockerfile
    environment:
      - ConnectionStrings__Default=Host=db;Port=5432;Database=marcas;Username=postgres;Password=postgres
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
